namespace: rivers

# RustFS is dev-cluster scaffolding for the example pipelines; production
# deployments bring their own S3-compatible store and wire creds via
# CodeLocation.spec.env.
rustfs:
  image: rustfs/rustfs:latest
  # Root image for the chown-to-10001 init container (RustFS's data dir must
  # be owned by its non-root uid; k3d's local-path-provisioner doesn't honor
  # fsGroup on its hostPath-backed PVs, so this can't be done via securityContext).
  initImage: busybox:stable
  # No `mc`-equivalent ships with RustFS; the AWS CLI talks to any
  # S3-compatible endpoint via --endpoint-url.
  awsCliImage: amazon/aws-cli:latest
  accessKey: rivers
  secretKey: riverstest
  bucket: rivers-io

# S3-compatible env vars stamped onto every CodeLocation's executor and
# step pods. Defaults point at the in-cluster RustFS above.
s3:
  endpoint: http://rustfs.rivers.svc:9000
  bucket: rivers-io
  accessKey: rivers
  secretKey: riverstest
  region: us-east-1

# OTLP collector for the OTel integration test; the rivers release points
# `otel.endpoint` / `otel.headers.existingSecret` at it (see helmfile).
otel:
  image: otel/opentelemetry-collector-contrib:0.140.0
  token: rivers-k3d-token

# CodeLocations to apply. The rivers operator is deployed with
# `operator.allowInsecureRegistry: true` so it can resolve digests directly
# from the HTTP-only k3d registry — `digest` here is optional.
codeLocations: []
  # - name: k8s-test-pipeline
  #   image: k3d-rivers-registry:5000/rivers-code-location
  #   module: k8s_test_pipeline.pipeline
  #   replicas: 1
