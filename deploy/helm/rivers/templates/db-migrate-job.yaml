{{- /*
Runs `rivers db migrate` on each install and upgrade. A regular Job, not a
hook, for the reason in surrealdb-user-job.yaml: the operator is not Ready
until the database is migrated, so a hook after `--wait` never runs. The
Job retries until SurrealDB and its user exist.
*/ -}}
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migrate-r{{ .Release.Revision }}
  namespace: {{ include "rivers.namespace" . }}
  labels:
    app.kubernetes.io/name: rivers-db-migrate
    {{- include "rivers.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rivers-db-migrate
        {{- include "rivers.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ .Values.migration.image | default (include "rivers.runtimeImage" .) }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            {{- include "rivers.surrealEnv" . | nindent 12 }}
          args:
            - "db"
            - "migrate"
            {{- if .Values.migration.force }}
            - "--force"
            {{- end }}
{{- end }}
