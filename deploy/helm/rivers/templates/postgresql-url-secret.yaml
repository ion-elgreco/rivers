{{- /*
Chart-managed Secret holding the PostgreSQL connection URL. Materialised only
when the user gave an inline `postgresql.url` and no `existingSecret` — the
URL embeds a password, so it must reach pods through a Secret rather than a
plain pod-spec value.
*/ -}}
{{- if and (include "rivers.usePostgres" .) (not .Values.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rivers.postgresSecretName" . }}
  namespace: {{ include "rivers.namespace" . }}
  labels:
    {{- include "rivers.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgresql.secretKeys.url }}: {{ .Values.postgresql.url | quote }}
{{- end }}
