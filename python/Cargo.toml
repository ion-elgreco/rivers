[package]
name = "rivers"
version.workspace = true
edition = "2024"
license.workspace = true
readme = "README.md"

[lib]
name = "rivers"
crate-type = ["cdylib"]

[dependencies]
rivers-core = { path = "../rust/rivers-core" }
rivers-ui = { path = "../rust/rivers-ui", features = ["ssr"] }
rivers-api = { path = "../rust/rivers-api" }
petgraph.workspace = true
tonic.workspace = true
http = "1"
tonic-prost.workspace = true
tonic-health.workspace = true
prost.workspace = true

pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py311", "jiff-02"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pyo3-arrow = { version = "0.19", default-features = false }
arrow-schema = "59"
arrow-ipc = "59"
jiff.workspace = true
croner.workspace = true
url.workspace = true
rustls.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pyo3-pylogger = "0.5"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "tls-webpki-roots"] }
rustls-native-certs = "0.8"
tracing-opentelemetry = "0.32"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
uuid.workspace = true
humantime.workspace = true
ordermap = "1"
rivers-k8s = { path = "../rust/rivers-k8s" }
# Direct kube subcrate dep — python only uses `kube_client::{Client, Api,
# api::PostParams, Error}`. Skipping `kube-runtime`/`kube-derive` here keeps
# them out of this crate's compile graph (rivers-k8s/operator still pull
# them where needed).
kube-client.workspace = true
k8s-openapi.workspace = true
# Embedded SurrealDB server behind `rivers dev`. Pinned exactly: SurrealDB
# calls this crate's API unstable.
surrealdb-server = { version = "=3.3.0", default-features = false, features = ["storage-rocksdb"], optional = true }
axum = { workspace = true, optional = true }

[features]
default = ["dev-server"]
# The embedded storage server of `rivers dev`; left out of the code-location pod image.
dev-server = ["dep:surrealdb-server", "dep:axum"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading"] }

[build-dependencies]
pyo3-build-config = "0.29.3"
