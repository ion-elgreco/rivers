[package]
name = "rivers-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rivers-runtime"
path = "src/main.rs"

[dependencies]
# The pod-side binary of the runtime image, a static musl build: only the
# CRD types from rivers-crd, never rivers-core.
rivers-crd = { path = "../rivers-crd" }
serde_json.workspace = true
# The Basic auth header for git over https.
base64.workspace = true

[target.'cfg(unix)'.dependencies]
# SIGTERM to a child's process group past the build budget.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
