[package]
name = "rivers-k8s"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# The CRD types live in rivers-crd (also linked by rivers-runtime, which
# must stay small). Direct kube subcrate deps — `kube` umbrella replaced with
# the layers we actually use. No `kube-runtime`: this crate doesn't run
# controllers itself (the operator does).
rivers-crd = { path = "../rivers-crd" }
kube-client.workspace = true
kube-core = { workspace = true, features = ["schema"] }
k8s-openapi = { workspace = true, features = ["schemars"] }
kube_quantity.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
rivers-core = { path = "../rivers-core" }
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[[bin]]
name = "rivers-gen-crd"
path = "src/bin/gen_crd.rs"
