[project]
name = "rivers-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
default-groups = ["dev", "grpc", "dbt"]
# grpcio-tools 1.82+ needs protobuf 7, and dbt-adapters caps it below 7. dbt
# runs on protobuf 7, so the workspace lifts dbt's cap.
override-dependencies = ["protobuf>=7.35.1,<8"]

[tool.uv.workspace]
members = [
    "python",
    "examples/package_demo",
]

[dependency-groups]
dev = [
    # test & dev tooling
    "py-spy>=0.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pyright>=1.1.414",
    "ruff>=0.17.1",
    "typos>=1.51.1",
    "cryptography>=50.0.2",
    "kr8s>=0.20",
    "pyyaml>=6.0",
    "rumdl>=0.3.0",
    # Memory sampling for the comparison benchmark in bench/.
    "psutil>=7.0",
    # SQLite catalog for the Iceberg tests.
    "sqlalchemy>=2.1.5",
]
# gRPC client for the API tests. No free-threaded (3.14t) wheels yet, so
# `just venv-ft` leaves this group out.
grpc = [
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
]
# dbt adapter for the dbt integration tests. Its dependencies have no
# free-threaded (3.14t) wheels, so `just venv-ft` leaves this group out.
dbt = [
    "dbt-duckdb>=1.11.0",
]
