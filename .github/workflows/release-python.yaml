name: release-python

# Builds the rivers Python wheels for all supported platforms and
# publishes to PyPI via Trusted Publishing on tag push (v*.*.*).
#
# Wheels are abi3-py310, so one wheel per (os, libc, arch) covers
# Python 3.10+. Platforms: linux-gnu/{x86_64, aarch64} (manylinux_2_17),
# linux-musl/{x86_64, aarch64} (musllinux_1_2), macos/{x86_64, arm64},
# windows/x86_64.
#
# The linux-gnu wheels also go into the rivers-runtime image, the default
# image of git-sourced CodeLocations. One multi-arch (amd64 + arm64) tag per
# Python version: ghcr.io/<owner>/rivers-runtime:<version>-py<python>.
# One-time setup: after the first push, make the rivers-runtime package
# public (Settings → Packages), or clusters cannot read it without
# credentials.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # WASM is platform-independent — build once on Linux, reuse across
  # per-OS wheel jobs. The python crate's ssr-gated `include_bytes!`s
  # on `rust/rivers-ui/pkg/` would fail without it.
  build-wasm:
    name: Build hydration WASM bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment (no cache — release builds run from fresh state)
        uses: ./.github/actions/setup-env
        with:
          cache: "false"

      - name: Build rivers-ui hydration WASM
        run: just wasm

      - name: Upload WASM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivers-ui-pkg
          path: rust/rivers-ui/pkg/
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build wheel (linux ${{ matrix.libc }} ${{ matrix.arch }})
    needs: build-wasm
    # aarch64 builds run on native arm runners — cross-compiling aws-lc-sys
    # (pulled in by rustls via surrealdb + kube) through manylinux's
    # bundled cross-gcc reliably fails on bcm.c.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc — covers most distros from 2019+ (Debian 10+, Ubuntu
          # 18.10+, RHEL 8+). manylinux2014 (glibc 2.17) is shelved
          # because its CentOS 7 base only ships clang 3.4, which is too
          # old for surrealdb-librocksdb-sys's bindgen build.
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            libc: gnu
            manylinux: "2_28"
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            libc: gnu
            manylinux: "2_28"
            runner: ubuntu-24.04-arm
          # musl — covers Alpine and other distroless/musl-based images.
          - target: x86_64-unknown-linux-musl
            arch: x86_64
            libc: musl
            manylinux: musllinux_1_2
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            libc: musl
            manylinux: musllinux_1_2
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Download WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rivers-ui-pkg
          path: rust/rivers-ui/pkg/

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: false
          # rivers-api needs protoc at build time (prost-build);
          # surrealdb-librocksdb-sys needs libclang.so (bindgen).
          # Host-side installs aren't visible to the container.
          # protoc is downloaded as a binary so package-name drift
          # between manylinux_2_28 (AlmaLinux) and musllinux_1_2
          # (Alpine) doesn't bite us.
          before-script-linux: |
            set -euo pipefail
            if command -v dnf >/dev/null; then
              dnf install -y clang
            elif command -v yum >/dev/null; then
              yum install -y clang
            elif command -v apk >/dev/null; then
              apk add --no-cache clang-dev curl unzip
            fi
            # Keep in sync with mise.toml and .github/actions/setup-env.
            PROTOC_VERSION=36.1
            case "$(uname -m)" in
              x86_64)  PROTOC_ARCH=linux-x86_64 ;;
              aarch64) PROTOC_ARCH=linux-aarch_64 ;;
              *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
            esac
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip"
            unzip -o /tmp/protoc.zip -d /usr/local
            rm /tmp/protoc.zip
            protoc --version

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-macos:
    name: Build wheel (macos ${{ matrix.arch }})
    needs: build-wasm

    runs-on: macos-14
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          # maturin-action defaults MACOSX_DEPLOYMENT_TARGET to 10.12
          # for x86_64, but rocksdb's C++ uses std::variant which the
          # libc++ headers gate to 10.13+. Bump explicitly.
          - target: x86_64-apple-darwin
            arch: x86_64
            deployment-target: "10.13"
          - target: aarch64-apple-darwin
            arch: arm64
            deployment-target: "11.0"

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Download WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rivers-ui-pkg
          path: rust/rivers-ui/pkg/

      # rivers-api's prost-build invokes protoc at build time. `3.36.1` is
      # upstream v36.1 — install-action keeps protoc's legacy `3.` prefix.
      - name: Install protoc
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: protoc@3.36.1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: false

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-${{ matrix.arch }}
          path: python/dist/*.whl
          if-no-files-found: error

  build-windows:
    name: Build wheel (windows ${{ matrix.arch }})
    needs: build-wasm
    runs-on: windows-latest
    permissions:
      contents: read       # checkout sources
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        # windows-latest defaults to pwsh; the bash parameter expansion
        # for ${REF_NAME#v} needs an explicit shell pin.
        shell: bash
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set release version
        uses: ./.github/actions/set-release-version
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Download WASM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rivers-ui-pkg
          path: rust/rivers-ui/pkg/

      # surrealdb-librocksdb-sys's bindgen build script needs libclang.dll.
      # windows-latest ships LLVM preinstalled, but bindgen can't find it
      # unless LIBCLANG_PATH is set explicitly.
      - name: Expose preinstalled libclang to bindgen
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      # rivers-api's prost-build invokes protoc at build time. `3.36.1` is
      # upstream v36.1 — install-action keeps protoc's legacy `3.` prefix.
      - name: Install protoc
        uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: protoc@3.36.1

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: false

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "python/dist/*.whl"

      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-${{ matrix.arch }}
          path: python/dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publishing exchanges OIDC for upload token

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "wheel-*"
          merge-multiple: true

      - name: List dist
        run: ls -la dist

      # Trusted publishing is handled by PyO3/maturin-action itself:
      # given `id-token: write` it exchanges the OIDC token for a PyPI
      # publish token and sets MATURIN_PYPI_TOKEN. No CLI flag needed —
      # `maturin upload` (1.13) does not accept --trusted-publishing.
      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

  # One single-arch rivers-runtime image per (Python, arch), built on a
  # native runner from this release's glibc wheel; runtime-manifest stitches
  # each Python version into one multi-arch tag.
  build-runtime-images:
    name: Build & push rivers-runtime py${{ matrix.python }} (${{ matrix.platform.arch }})
    needs: build-linux
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read       # checkout Dockerfile.runtime + rivers-workspace-sync
      packages: write      # push images to ghcr.io
      id-token: write      # OIDC for Sigstore signing via attest-build-provenance
      attestations: write  # publish SLSA provenance to repo attestation log

    strategy:
      fail-fast: true
      matrix:
        # Keep in sync with runtime-manifest, the Dockerfile.runtime header,
        # and the chart's codeLocation.runtime.pythonVersion default.
        python: ["3.11", "3.12", "3.13"]
        platform:
          - arch: amd64
            runner: ubuntu-latest
            wheel: wheel-linux-gnu-x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            wheel: wheel-linux-gnu-aarch64

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rivers-runtime

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the glibc wheel for this arch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.wheel }}
          path: staging/wheels/

      - name: Stage rivers-workspace-sync
        run: cp deploy/docker/rivers-workspace-sync staging/

      - name: Resolve image ref
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          PYTHON: ${{ matrix.python }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          owner_lc="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          version="${REF_NAME#v}"
          repo="${REGISTRY}/${owner_lc}/${IMAGE_NAME}"
          {
            echo "repo=${repo}"
            echo "version=${version}"
            echo "arch_tag=${repo}:${version}-py${PYTHON}-${ARCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: staging
          file: deploy/docker/Dockerfile.runtime
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ${{ steps.ref.outputs.arch_tag }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
            RIVERS_VERSION=${{ steps.ref.outputs.version }}
            RIVERS_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.ref.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  runtime-manifest:
    name: Multi-arch manifest (rivers-runtime py${{ matrix.python }})
    needs: build-runtime-images
    runs-on: ubuntu-latest
    permissions:
      packages: write  # push the multi-arch index manifest to ghcr.io

    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13"]

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: rivers-runtime

    steps:
      - name: Resolve refs
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          PYTHON: ${{ matrix.python }}
        run: |
          owner_lc="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=${REGISTRY}/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF_NAME#v}-py${PYTHON}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          REPO: ${{ steps.ref.outputs.repo }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${REPO}:${TAG}" \
            "${REPO}:${TAG}-amd64" \
            "${REPO}:${TAG}-arm64"
